<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<title>Ações Sociais</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f14; --bg2:#17171f; --card:#1d1d27; --card2:#252532; --line:#2f2f3e;
  --tx:#f3f1f5; --tx2:#a9a6b5; --pink:#ff4f9a; --pink2:#ff7ab4; --pinkbg:rgba(255,79,154,.12);
  --ok:#2ecc8f; --okbg:rgba(46,204,143,.14); --warn:#ffb547; --warnbg:rgba(255,181,71,.14);
  --err:#ff5b5b; --errbg:rgba(255,91,91,.14); --info:#5fa8ff; --infobg:rgba(95,168,255,.14);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Barlow Condensed',system-ui,sans-serif;font-size:17px;line-height:1.35}
a{color:var(--pink2)}
h1,h2,h3,.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;font-weight:400;margin:0}
h1{font-size:34px} h2{font-size:28px} h3{font-size:22px}
.muted{color:var(--tx2)} .small{font-size:14px} .center{text-align:center}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 110px}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(15,15,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-family:'Bebas Neue';font-size:24px;color:var(--pink);white-space:nowrap}
.top .brand span{overflow:hidden;text-overflow:ellipsis}
.brand-logo{width:40px;height:40px;flex:none}
.avatar{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;object-fit:cover;background:var(--pinkbg);color:var(--pink2);font-weight:700;border:2px solid var(--pink)}
.foto-perfil{display:flex;justify-content:center}
.nav a span .avatar{border-width:1.5px;vertical-align:middle}
.logo-img{display:block;width:170px;height:170px;margin:0 auto 6px}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.dot{position:absolute;top:-5px;right:-5px;background:var(--pink);color:#fff;font-size:12px;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(23,23,31,.97);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:9px 2px 8px;color:var(--tx2);text-decoration:none;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.nav a span{display:block;font-size:21px;margin-bottom:1px}
.nav a.on{color:var(--pink)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.hl{border-color:var(--pink);background:linear-gradient(160deg,rgba(255,79,154,.10),var(--card) 60%)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:'Bebas Neue';font-size:34px;color:var(--pink);line-height:1}
.stat small{color:var(--tx2);text-transform:uppercase;font-size:13px;font-weight:600;letter-spacing:.4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sp{height:12px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-family:'Barlow Condensed';font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;text-decoration:none;color:#fff;background:var(--pink);transition:.15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#0b2a1d} .btn.err{background:var(--err)} .btn.warn{background:var(--warn);color:#2b1d00}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--pink2);padding:6px 8px}
/* forms */
label{display:block;font-size:14px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:12px;font-family:'Barlow Condensed';font-size:17px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pink)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--pink);transform:scale(1.3);margin-right:8px}
.check{display:flex;align-items:flex-start;gap:4px;text-transform:none;font-size:16px;color:var(--tx);letter-spacing:0}
/* badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)}
.b-err{background:var(--errbg);color:var(--err)} .b-info{background:var(--infobg);color:var(--info)}
.b-pink{background:var(--pinkbg);color:var(--pink2)} .b-gray{background:var(--card2);color:var(--tx2)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-weight:700;text-transform:uppercase;font-size:14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
/* list items */
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.item .t{font-weight:700;font-size:19px}
.acao-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;cursor:pointer;display:block;color:inherit;text-decoration:none}
.acao-card .cover{height:150px;background:var(--card2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:46px}
.acao-card .body{padding:13px 14px}
.cover-lg{height:210px;border-radius:var(--r);background:var(--card2) center/cover no-repeat;margin-bottom:14px;display:flex;align-items:center;justify-content:center;font-size:60px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.info-line{display:flex;gap:9px;margin:6px 0}
.info-line span:first-child{width:22px;flex:none;text-align:center}
.prewrap{white-space:pre-wrap}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--card2);font-weight:700;text-transform:uppercase;font-size:13px;color:var(--tx2)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:0 0 calc(18px + env(safe-area-inset-bottom))}
.modal.wide{max-width:820px}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.modal-head{position:sticky;top:0;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}
.modal-body{padding:4px 16px 0}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:480px;pointer-events:none}
.toast{background:var(--ok);color:#06231a;padding:12px 15px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:fade .2s}
.toast.err{background:var(--err);color:#fff}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth .box{width:100%;max-width:420px}
.logo{font-size:56px;text-align:center}
.qr{background:#fff;padding:14px;border-radius:14px;width:max-content;margin:10px auto}
.copy{font-family:monospace;font-size:13px;word-break:break-all;background:var(--bg);padding:10px;border-radius:10px;border:1px dashed var(--line)}
.loading{text-align:center;padding:60px 0;color:var(--tx2)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--tx2);padding:26px 10px}
.progress{height:10px;background:var(--card2);border-radius:10px;overflow:hidden}
.progress div{height:100%;background:var(--pink)}
.notif{border-left:3px solid var(--pink)} .notif.lida{border-left-color:var(--line);opacity:.7}
.admin-grid a{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--tx)}
.admin-grid a b{display:block;font-family:'Bebas Neue';font-size:22px}
.admin-grid a span{font-size:28px}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Carregando…</div></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="admin.js?v=3"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
